name: Test no cleanup (all options disabled)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Record disk space before
        id: before
        run: |
          AVAIL=$(df -a / | awk 'NR > 1 {avail+=$4} END {print avail}')
          echo "available=$AVAIL" >> "$GITHUB_OUTPUT"
          echo "Disk space before: $AVAIL KB"

      - name: Run free-disk-space with all options disabled
        id: action
        uses: .
        with:
          android: "false"
          dotnet: "false"
          haskell: "false"
          large-packages: "false"
          swap-storage: "false"

      - name: Assert action completed without removing anything
        run: |
          AVAIL_AFTER=$(df -a / | awk 'NR > 1 {avail+=$4} END {print avail}')
          AVAIL_BEFORE="${{ steps.before.outputs.available }}"
          echo "Disk space before: $AVAIL_BEFORE KB"
          echo "Disk space after:  $AVAIL_AFTER KB"
          echo "PASS: action completed with all options disabled"
