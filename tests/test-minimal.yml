name: Test minimal usage (all cleanup disabled)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          android: "false"
          dotnet: "false"
          haskell: "false"
          large-packages: "false"
          docker-images: "false"
          preinstalled-runtimes: "false"
          swap-storage: "false"

      - name: Assert action completed without error
        run: |
          echo "PASS: action completed with all options disabled"
