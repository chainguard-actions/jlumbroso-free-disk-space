name: Test minimal usage (all options disabled)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Record disk space before
        id: before
        run: |
          AVAIL=$(df -a / | awk 'NR > 1 {avail+=$4} END {print avail}')
          echo "available=$AVAIL" >> "$GITHUB_OUTPUT"
          echo "Disk available before: $AVAIL KB"

      - name: Run free-disk-space action with all options disabled (no-op)
        id: action
        uses: .
        with:
          android: "false"
          dotnet: "false"
          haskell: "false"
          large-packages: "false"
          docker-images: "false"
          tool-cache: "false"
          swap-storage: "false"

      - name: Assert action completed and disk space is unchanged or better
        env:
          BEFORE: ${{ steps.before.outputs.available }}
        run: |
          echo "Disk available before: $BEFORE KB"
          AFTER=$(df -a / | awk 'NR > 1 {avail+=$4} END {print avail}')
          echo "Disk available after: $AFTER KB"
          if [ -z "$AFTER" ]; then
            echo "FAIL: could not read disk space after no-op run"
            exit 1
          fi
          # With all options disabled, disk space should be roughly the same
          # (allow for minor OS fluctuations; just verify it's a positive number)
          if [ "$AFTER" -le 0 ] 2>/dev/null; then
            echo "FAIL: disk space is unexpectedly zero or negative: $AFTER"
            exit 1
          fi
          echo "PASS: no-op run completed successfully, disk space after = $AFTER KB"
