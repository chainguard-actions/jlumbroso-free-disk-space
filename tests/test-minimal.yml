name: Test minimal usage (all options disabled)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Record disk space before
        id: before
        run: |
          AVAIL=$(df -a / | awk 'NR > 1 {avail+=$4} END {print avail}')
          echo "available=$AVAIL" >> "$GITHUB_OUTPUT"
          echo "Disk available before: $AVAIL KB"

      - name: Run free-disk-space action with all options disabled (no-op)
        id: action
        uses: .
        with:
          android: "false"
          dotnet: "false"
          haskell: "false"
          large-packages: "false"
          tool-cache: "false"
          swap-storage: "false"

      - name: Assert action completed successfully with no-op
        run: |
          echo "Action completed with all options disabled (no-op)"
          echo "PASS: no-op run completed without error"

      - name: Assert disk space is still readable and filesystem intact
        env:
          BEFORE: ${{ steps.before.outputs.available }}
        run: |
          AFTER=$(df -a / | awk 'NR > 1 {avail+=$4} END {print avail}')
          echo "Disk available before: $BEFORE KB"
          echo "Disk available after:  $AFTER KB"
          if [ -z "$AFTER" ]; then
            echo "FAIL: could not read available disk space after no-op run"
            exit 1
          fi
          echo "PASS: filesystem intact after no-op run"
