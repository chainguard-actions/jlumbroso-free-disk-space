name: Test selective cleanup (dotnet only)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run free-disk-space action with only dotnet removal enabled
        id: action
        uses: .
        with:
          android: "false"
          dotnet: "true"
          haskell: "false"
          large-packages: "false"
          tool-cache: "false"
          swap-storage: "false"

      - name: Assert action completed successfully
        run: |
          echo "Action completed with dotnet=true, all others=false"
          echo "PASS: selective cleanup ran without error"

      - name: Assert filesystem is still healthy
        run: |
          AVAIL=$(df -a / | awk 'NR > 1 {avail+=$4} END {print avail}')
          echo "Disk available after selective cleanup: $AVAIL KB"
          if [ -z "$AVAIL" ]; then
            echo "FAIL: could not read available disk space after cleanup"
            exit 1
          fi
          echo "PASS: filesystem is healthy after selective cleanup"
