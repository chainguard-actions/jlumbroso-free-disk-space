name: Test selective cleanup (android + dotnet only)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Record disk space before
        id: before
        run: |
          AVAIL=$(df -a / | awk 'NR > 1 {avail+=$4} END {print avail}')
          echo "available=$AVAIL" >> "$GITHUB_OUTPUT"
          echo "Disk available before: $AVAIL KB"

      - name: Run free-disk-space action with only android and dotnet enabled
        id: action
        uses: .
        with:
          android: "true"
          dotnet: "true"
          haskell: "false"
          large-packages: "false"
          docker-images: "false"
          tool-cache: "false"
          swap-storage: "false"

      - name: Assert action completed successfully
        env:
          BEFORE: ${{ steps.before.outputs.available }}
        run: |
          echo "Disk available before: $BEFORE KB"
          AFTER=$(df -a / | awk 'NR > 1 {avail+=$4} END {print avail}')
          echo "Disk available after: $AFTER KB"
          if [ -z "$AFTER" ]; then
            echo "FAIL: could not read disk space after cleanup"
            exit 1
          fi
          echo "PASS: selective cleanup completed, disk space after = $AFTER KB"
