name: Test deprecated tool-cache input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Capture action output for warning check
        id: action
        uses: .
        with:
          android: "false"
          dotnet: "false"
          haskell: "false"
          large-packages: "false"
          docker-images: "false"
          tool-cache: "true"
          preinstalled-runtimes: "false"
          swap-storage: "false"

      - name: Assert action completed with deprecated tool-cache input
        run: |
          echo "PASS: action completed with deprecated tool-cache: true input"
          echo "The action should have printed a deprecation warning and removed the tool cache directory"
