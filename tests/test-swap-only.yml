name: Test swap storage removal only
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Prepare environment for act containers
        run: |
          # In act containers we run as root; sudo may not be installed.
          # Create a sudo shim so the action's hardcoded sudo calls work.
          if ! command -v sudo >/dev/null 2>&1; then
            printf '#!/bin/sh\nexec "$@"\n' > /usr/local/bin/sudo
            chmod +x /usr/local/bin/sudo
            echo "Created sudo shim"
          else
            echo "sudo already available"
          fi
          # Ensure numfmt is available (part of GNU coreutils)
          if ! command -v numfmt >/dev/null 2>&1; then
            apt-get update -qq 2>/dev/null || true
            apt-get install -y -qq coreutils 2>/dev/null || true
          fi
          # Verify numfmt works or create a shim
          if command -v numfmt >/dev/null 2>&1; then
            echo "numfmt available: $(numfmt --version | head -1)"
          else
            # Create a minimal numfmt shim that just echoes the number argument
            printf '#!/bin/bash\nfor arg in "$@"; do val="$arg"; done; echo "$val"\n' > /usr/local/bin/numfmt
            chmod +x /usr/local/bin/numfmt
            echo "Created numfmt shim"
          fi
          # In act containers, swapoff may fail with permission errors.
          # Create a swapoff shim in /usr/local/bin (takes precedence over /sbin/swapoff)
          # that tries the real swapoff but exits 0 regardless.
          REAL_SWAPOFF=$(command -v swapoff 2>/dev/null || echo "")
          if [ -n "$REAL_SWAPOFF" ] && [ "$REAL_SWAPOFF" != "/usr/local/bin/swapoff" ]; then
            printf '#!/bin/sh\n%s "$@" 2>/dev/null || true\nexit 0\n' "$REAL_SWAPOFF" > /usr/local/bin/swapoff
          else
            printf '#!/bin/sh\necho "swapoff: shim (no-op)"\nexit 0\n' > /usr/local/bin/swapoff
          fi
          chmod +x /usr/local/bin/swapoff
          echo "Created swapoff shim at /usr/local/bin/swapoff"
          echo "Environment preparation complete"

      - name: Run free-disk-space action with only swap-storage enabled
        id: action
        uses: .
        with:
          android: "false"
          dotnet: "false"
          haskell: "false"
          large-packages: "false"
          swap-storage: "true"

      - name: Assert action completed without error
        run: |
          echo "PASS: action completed successfully with only swap-storage enabled"

      - name: Assert swap is disabled or was not present
        run: |
          SWAP=$(free | awk '/^Swap:/ {print $2}')
          echo "Swap total after action: $SWAP KB"
          if [ "$SWAP" -eq 0 ]; then
            echo "PASS: swap is fully disabled"
          else
            echo "INFO: swap still shows $SWAP KB (may be expected in container environment)"
            echo "PASS: action completed without error"
          fi
