name: Test all options disabled (no-op)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Record initial disk space
        id: before
        run: |
          AVAIL=$(df -a / | awk 'NR > 1 {avail+=$4} END {print avail}')
          echo "available=$AVAIL" >> "$GITHUB_OUTPUT"
          echo "Initial available (KB): $AVAIL"

      - id: action
        uses: .
        with:
          android: "false"
          dotnet: "false"
          haskell: "false"
          large-packages: "false"
          docker-images: "false"
          tool-cache: "false"
          swap-storage: "false"

      - name: Assert action completed without removing anything
        env:
          BEFORE: ${{ steps.before.outputs.available }}
        run: |
          AFTER=$(df -a / | awk 'NR > 1 {avail+=$4} END {print avail}')
          echo "Before (KB): $BEFORE"
          echo "After  (KB): $AFTER"
          if [ -z "$AFTER" ]; then
            echo "FAIL: could not read disk space after action"
            exit 1
          fi
          # When nothing is removed, disk space should be approximately the same
          # Allow a small delta (up to 100MB = 102400 KB) for filesystem overhead
          DELTA=$(( AFTER - BEFORE ))
          ABS_DELTA=${DELTA#-}
          echo "Delta (KB): $DELTA (absolute: $ABS_DELTA)"
          if [ "$ABS_DELTA" -gt 102400 ]; then
            echo "FAIL: disk space changed by more than 100MB when all options disabled (delta: $ABS_DELTA KB)"
            exit 1
          fi
          echo "PASS: no-op completed successfully, disk space unchanged (delta: $DELTA KB)"
