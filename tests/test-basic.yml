name: Test basic usage (safe defaults for act)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Record disk space before
        id: before
        run: |
          AVAIL=$(df -a / | awk 'NR > 1 {avail+=$4} END {print avail}')
          echo "available=$AVAIL" >> $GITHUB_OUTPUT
          echo "Disk available before: $AVAIL KB"
          df -h /

      - name: Run free-disk-space action (android + dotnet + haskell only)
        id: action
        uses: .
        with:
          android: "true"
          dotnet: "true"
          haskell: "true"
          large-packages: "false"
          tool-cache: "false"
          swap-storage: "false"

      - name: Assert action completed and disk space is readable
        run: |
          echo "Action completed successfully"
          df -h /
          AVAIL=$(df -a / | awk 'NR > 1 {avail+=$4} END {print avail}')
          echo "Disk available after: $AVAIL KB"
          if [ -z "$AVAIL" ]; then
            echo "FAIL: could not read disk space after action"
            exit 1
          fi
          echo "PASS: action ran to completion"
