name: Test basic usage (safe defaults for act)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Record disk space before
        id: before
        run: |
          AVAIL=$(df -a / | awk 'NR > 1 {avail+=$4} END {print avail}')
          echo "available=$AVAIL" >> "$GITHUB_OUTPUT"
          echo "Disk available before: $AVAIL KB"

      - name: Run free-disk-space action (rm-based options only, no apt-get or swapoff)
        id: action
        uses: .
        with:
          android: "true"
          dotnet: "true"
          haskell: "true"
          large-packages: "false"
          tool-cache: "false"
          swap-storage: "false"

      - name: Assert action completed and filesystem is intact
        run: |
          echo "Action completed successfully (exit 0)"
          AVAIL=$(df -a / | awk 'NR > 1 {avail+=$4} END {print avail}')
          echo "Disk available after: $AVAIL KB"
          if [ -z "$AVAIL" ]; then
            echo "FAIL: could not read available disk space"
            exit 1
          fi
          echo "PASS: action ran without error and filesystem is readable"
