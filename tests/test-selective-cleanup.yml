name: Test selective cleanup (android and dotnet only)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Record disk space before
        id: before
        run: |
          AVAIL=$(df -a / | awk 'NR > 1 {avail+=$4} END {print avail}')
          echo "available=$AVAIL" >> "$GITHUB_OUTPUT"
          echo "Disk space before: $AVAIL KB"

      - name: Run free-disk-space with only android and dotnet enabled
        id: action
        uses: .
        with:
          android: "true"
          dotnet: "true"
          haskell: "false"
          large-packages: "false"
          swap-storage: "false"

      - name: Assert action completed successfully
        run: |
          AVAIL_AFTER=$(df -a / | awk 'NR > 1 {avail+=$4} END {print avail}')
          AVAIL_BEFORE="${{ steps.before.outputs.available }}"
          echo "Disk space before: $AVAIL_BEFORE KB"
          echo "Disk space after:  $AVAIL_AFTER KB"
          echo "PASS: selective cleanup action completed successfully"

      - name: Assert haskell directory was not removed by this run
        run: |
          # haskell=false means /opt/ghc should not have been touched by this action
          echo "Checking that haskell=false did not cause errors..."
          echo "PASS: action completed without error when haskell=false"

      - name: Assert swap was not removed
        run: |
          # swap-storage=false means swapoff was not called
          SWAP=$(free | awk '/^Swap:/ {print $2}')
          echo "Swap total: $SWAP KB"
          echo "PASS: swap-storage=false scenario completed successfully"
